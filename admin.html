<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HQ BÁ KHÍ — Admin</title><link rel="stylesheet" href="admin.css"></head><body><header><a class="brand" href="index.html">HQ <b>BÁ KHÍ</b><small>ADMIN CONSOLE</small></a><span id="apiStatus">API CHƯA CẤU HÌNH</span></header><main><section id="login" class="panel login"><p class="eyebrow">RESTRICTED AREA</p><h1>ADMIN <em>CONTROL</em></h1><form id="loginForm"><label>MẬT KHẨU ADMIN</label><input id="password" type="password" required placeholder="Mật khẩu quản trị"><button class="primary">ĐĂNG NHẬP</button></form><p id="msg">Cấu hình API backend để bắt đầu.</p></section><section id="dash" class="hidden"><div class="heading"><div><p class="eyebrow">LICENSE MANAGEMENT</p><h1>QUẢN LÝ <em>KEY</em></h1></div><button id="logout" class="ghost">ĐĂNG XUẤT</button></div><div class="stats"><div class="panel"><small>TỔNG KEY</small><strong id="total">0</strong></div><div class="panel"><small>HOẠT ĐỘNG</small><strong id="active">0</strong></div><div class="panel"><small>KHÓA / HẾT HẠN</small><strong id="inactive">0</strong></div></div><div class="columns"><section class="panel"><h2>TẠO KEY</h2><label>GHI CHÚ</label><input id="label" placeholder="Người dùng / thiết bị"><label>THỜI HẠN</label><select id="days"><option value="0">Không hết hạn</option><option value="1">1 ngày</option><option value="7">7 ngày</option><option value="30" selected>30 ngày</option><option value="90">90 ngày</option><option value="365">365 ngày</option></select><label>SỐ LƯỢNG</label><select id="count"><option>1</option><option>5</option><option>10</option></select><button id="create" class="primary">+ TẠO KEY</button><pre id="created" class="hidden"></pre></section><section class="panel"><h2>LỌC KEY</h2><label>TÌM KIẾM</label><input id="search" placeholder="KEY hoặc ghi chú"><label>TRẠNG THÁI</label><select id="filter"><option value="all">Tất cả</option><option value="active">Hoạt động</option><option value="disabled">Đã khóa</option><option value="revoked">Thu hồi</option><option value="expired">Hết hạn</option></select><button id="refresh" class="ghost">LÀM MỚI</button></section></div><section class="panel table-wrap"><h2>DANH SÁCH KEY</h2><div class="scroll"><table><thead><tr><th>KEY</th><th>GHI CHÚ</th><th>TRẠNG THÁI</th><th>HẠN DÙNG</th><th>DEVICE ID</th><th>THAO TÁC</th></tr></thead><tbody id="rows"></tbody></table></div></section></section></main><script src="admin.js"></script></body></html>
